name: 报告问题
description: 报告可以稳定复现的 done灯 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。公开 Issue 中请勿上传私人截图、窗口标题、日志原文、API Key 或其他敏感信息。

  - type: input
    id: version
    attributes:
      label: done灯 版本
      description: 可在“设置”页面底部查看。
      placeholder: 例如 0.3.4 (8)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 与 Mac 型号
      placeholder: 例如 macOS 15.6，MacBook Air M3
    validations:
      required: true

  - type: dropdown
    id: route
    attributes:
      label: 使用的记录方式
      options:
        - 仅记录
        - 本地模型（Ollama）
        - Codex Agent（在线）
        - 模型 API
        - 不确定或无关
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出最少、可重复的操作步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 可以提供已脱敏的错误提示；不要粘贴原始截图、完整日志或密钥。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认反馈中不包含私人截图、窗口标题、API Key 或其他敏感信息。
          required: true

